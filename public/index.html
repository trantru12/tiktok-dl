<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tải Video TikTok</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #f5f5f7; color: #1d1d1f;
    min-height: 100vh; padding: 24px 16px;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: #666; margin: 0 0 22px; font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input {
    flex: 1; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; outline: none;
  }
  input:focus { border-color: #000; }
  button {
    padding: 12px 18px; border: none; border-radius: 10px;
    background: #000; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .card {
    background: #fff; border-radius: 14px; padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .card img { width: 100%; border-radius: 10px; margin-bottom: 12px; display: block; }
  .card h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.4; }
  .card p { margin: 0 0 14px; color: #666; font-size: 14px; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .btns a {
    display: block; padding: 12px; border-radius: 10px; text-align: center;
    text-decoration: none; color: #fff; background: #000; font-size: 15px;
  }
  .btns a.alt { background: #e5e5ea; color: #000; }
  .hint {
    margin-top: 22px; font-size: 13px; color: #888;
    padding: 12px; background: #fff; border-radius: 10px; line-height: 1.5;
  }
  .err { color: #c00; padding: 12px; background: #ffeaea; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>🎵 Tải Video TikTok</h1>
  <p class="sub">Dán link TikTok, tải về iPad để lưu trữ</p>

  <form id="f">
    <input id="url" type="url" required
      placeholder="https://www.tiktok.com/@user/video/..."
      inputmode="url" autocomplete="off">
    <button type="submit">Lấy</button>
  </form>

  <div id="result"></div>

  <p class="hint">
    💡 <b>Trên iPad:</b> sau khi lấy video, <b>nhấn giữ</b> nút tải → chọn
    <b>"Tải file liên kết"</b> hoặc <b>"Lưu vào Tệp"</b>.
  </p>
</main>

<script>
  const f = document.getElementById('f');
  const urlInp = document.getElementById('url');
  const result = document.getElementById('result');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = f.querySelector('button');
    btn.disabled = true;
    result.innerHTML = '<p style="color:#666">⏳ Đang xử lý…</p>';

    try {
      const r = await fetch('/api/download?url=' + encodeURIComponent(urlInp.value.trim()));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Lỗi không xác định');

      result.innerHTML = `
        <div class="card">
          ${j.cover ? `<img src="${esc(j.cover)}" alt="">` : ''}
          <h3>${esc(j.title)}</h3>
          <p>👤 ${esc(j.author)}</p>
          <div class="btns">
            ${j.hdplay ? `<a href="${esc(j.hdplay)}" download>⬇️ Tải video (HD)</a>` : ''}
            ${j.play && j.play !== j.hdplay ? `<a class="alt" href="${esc(j.play)}" download>⬇️ Tải video (SD)</a>` : ''}
            ${j.music ? `<a class="alt" href="${esc(j.music)}" download>🎵 Tải âm thanh</a>` : ''}
          </div>
        </div>`;
    } catch (err) {
      result.innerHTML = `<div class="err">❌ ${esc(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
